<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14432c">
<title>Golf en Familia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">⛳</span>
    <div>
      <h1>Golf en Familia <span class="sync-badge" id="sync-badge"></span></h1>
      <p id="topbar-sub">Handicap · Robin · War</p>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones">
    <button data-tab="ronda"><span class="ti">🏌️</span><span>Ronda</span></button>
    <button data-tab="apuestas"><span class="ti">💰</span><span>Apuestas</span></button>
    <button data-tab="jugadores"><span class="ti">👥</span><span>Jugadores</span></button>
    <button data-tab="campos"><span class="ti">🚩</span><span>Campos</span></button>
    <button data-tab="ajustes"><span class="ti">⚙️</span><span>Ajustes</span></button>
  </nav>
</header>

<main id="view" class="view"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script defer src="config.js"></script>
<script defer src="handicap.js"></script>
<script defer src="store.js"></script>
<script defer src="bets.js"></script>
<script defer src="cloud.js"></script>
<script defer src="sync.js"></script>
<script defer src="app.js"></script>
</body>
</html>
